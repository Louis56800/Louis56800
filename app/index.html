<style>
/* Layout: one-column mobile app; night-blue duty band header with hi-vis chevrons, bottom tab bar, bottom-sheet forms */
:root {
  --bg: #e9edf3;
  --surface: #ffffff;
  --ink: #111a2b;
  --muted: #586378;
  --line: #d3d9e3;
  --accent: #1a2f5e;

  --accent-soft: #e0e7f3;
  --band: #0d1a33;
  --band-2: #16274a;
  --band-ink: #f2f5fa;
  --band-muted: #9fb0cf;
  --hivis: #e6c32e;
  --hivis-ink: #0d1a33;
  --ok: #1d7a4c;
  --warn: #a8640a;
  --crit: #b3261e;
  --font-display: "Big Shoulders Display", "Arial Narrow", system-ui, sans-serif;

  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;

}
@media (prefers-color-scheme: dark) {

    --bg: #080d17; --surface: #111a2a; --ink: #e6ebf3; --muted: #95a2b8; --line: #243149;
    --accent: #9db7ec; --accent-ink: #0b1220; --accent-soft: #1a2740;
    --band: #050a14; --band-2: #0f1a30; --band-ink: #eef2f8; --band-muted: #8798b8;
    --hivis: #e9c93f; --hivis-ink: #0b1220;
    --ok: #5fc48f; --warn: #e3a64a; --crit: #ef7a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {

  --accent: #9db7ec; --accent-ink: #0b1220; --accent-soft: #1a2740;
  --band: #050a14; --band-2: #0f1a30; --band-ink: #eef2f8; --band-muted: #8798b8;

* { box-sizing: border-box; }

  -webkit-mask: linear-gradient(90deg, transparent, #000 70%); mask: linear-gradient(90deg, transparent, #000 70%); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }

.pill.crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }

/* Calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cal-head b { font: 700 20px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.day { aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 1px solid transparent; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-variant-numeric: tabular-nums; font-size: 14px; padding: 0; }

nav.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }

.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

.check { display: flex; gap: 10px; align-items: center; font-size: 14px; padding: 4px 0; }

.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }

textarea.backup { width: 100%; min-height: 120px; font: 12px/1.4 var(--font-mono); border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); }
/* Lock screen */
#lock { position: fixed; inset: 0; z-index: 40; overflow-y: auto; color: var(--band-ink);

  background: repeating-linear-gradient(-55deg, var(--hivis) 0 12px, transparent 12px 16px, color-mix(in srgb, var(--band-ink) 45%, transparent) 16px 18px, transparent 18px 30px); opacity: .85; }

const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };

const daysUntil = s => Math.round((parse(s) - parse(todayIso())) / 86400000);

function duration(debut, fin, pause) {
  if (!debut || !fin) return 0;
  const [h1,m1] = debut.split(":").map(Number), [h2,m2] = fin.split(":").map(Number);
  let d = (h2*60+m2) - (h1*60+m1);
  if (d <= 0) d += 1440; // vacation de nuit, fin le lendemain
  return Math.max(0, d - (Number(pause)||0));
}

/* ---------- Agenda (.ics) ---------- */
const icsEsc = s => String(s ?? "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
const icsDate = s => s.replace(/-/g, "");
const icsDT = (s, hm) => icsDate(s) + "T" + hm.replace(":", "") + "00";
function fold(line) { const out = []; while (line.length > 72) { out.push(line.slice(0, 72)); line = " " + line.slice(72); } out.push(line); return out.join("\r\n"); }
function vevent(kind, o) {
  const L = ["BEGIN:VEVENT", `UID:${kind}-${o.id}@carnet-reserve`, "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
    "SEQUENCE:" + Math.floor(Date.now() / 1000)];
  let alarm, summary, desc = [], loc = "";
  if (kind === "vacation") {
    const s = svc(o.serviceId);
    const endDate = duration(o.debut, o.fin, 0) + (Number(o.debut.split(":")[0]) * 60 + Number(o.debut.split(":")[1])) >= 1440 ? addDays(o.date, 1) : o.date;
    L.push("DTSTART:" + icsDT(o.date, o.debut), "DTEND:" + icsDT(endDate, o.fin));
    summary = "Vacation · " + (s?.nom || "service non renseigné");
    loc = s?.unite || "";
    desc.push("Durée effective : " + fmtH(duration(o.debut, o.fin, o.pause)) + (o.pause ? ` (pause ${o.pause} min)` : ""));
    alarm = "-PT2H";
  } else if (kind === "tir") {
    L.push("DTSTART;VALUE=DATE:" + icsDate(o.date), "DTEND;VALUE=DATE:" + icsDate(addDays(o.date, 1)));
    summary = "Tir · " + o.type; loc = o.lieu; alarm = "-PT15H";
    if (o.statut === "fait") desc.push("Séance effectuée");
  } else {
    L.push("DTSTART;VALUE=DATE:" + icsDate(o.debut), "DTEND;VALUE=DATE:" + icsDate(addDays(o.fin || o.debut, 1)));
    summary = "Formation · " + o.intitule; loc = o.lieu; alarm = "-PT15H";
    if (o.statut === "annule") L.push("STATUS:CANCELLED");
  }
  if (o.note) desc.push(o.note);
  L.push("SUMMARY:" + icsEsc(summary));
  if (loc) L.push("LOCATION:" + icsEsc(loc));
  if (desc.length) L.push("DESCRIPTION:" + icsEsc(desc.join("\n")));
  L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(summary), "TRIGGER:" + alarm, "END:VALARM", "END:VEVENT");
  return L.map(fold).join("\r\n");
}
function buildIcs(entries) {

    ...entries.map(([k, o]) => vevent(k, o)), "END:VCALENDAR"].join("\r\n");
}

/* ---------- Coffre chiffré (AES-GCM, clé enveloppée par code, code de secours et Face ID) ---------- */
const VKEY = "cn-vault";
const ITER = 310000;
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
async function pwKey(secret, salt, iter) {
  const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
const rawKey = bytes => crypto.subtle.importKey("raw", bytes, "AES-GCM", false, ["encrypt", "decrypt"]);
async function seal(key, bytes) { const iv = rand(12); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes); return { iv: b64(iv), ct: b64(ct) }; }
async function unseal(key, box) { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct))); }
async function wrapSecret(secret, keyBytes) { const salt = rand(16); return { salt: b64(salt), iter: ITER, ...(await seal(await pwKey(secret, salt, ITER), keyBytes)) }; }
async function unwrapSecret(secret, w) { return unseal(await pwKey(secret, unb64(w.salt), w.iter), w); }
const RC_ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newRecoveryCode() { const r = rand(16); let c = ""; for (let i = 0; i < 16; i++) { c += RC_ALPHA[r[i] % RC_ALPHA.length]; if (i % 4 === 3 && i < 15) c += "-"; } return c; }
const normRC = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

let vault = null, dataKey = null, db = null;
function readVault() { try { return JSON.parse(localStorage.getItem(VKEY) || "null"); } catch (e) { return null; } }
function writeVault() {
  try { localStorage.setItem(VKEY, JSON.stringify(vault)); return true; }
  catch (e) { toast("Enregistrement impossible sur cet appareil. Faites une sauvegarde."); return false; }
}
function emptyDb() { return { settings: { tirObjectif: 3, titre: "", sousTitre: "" }, services: [], vacations: [], tirs: [], formations: [] }; }
function normalize(d) {
  d ||= emptyDb();
  ["services", "vacations", "tirs", "formations"].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  d.settings = { tirObjectif: 3, titre: "", sousTitre: "", contratDebut: "", plafond: 90, ...(d.settings || {}) };

}
let saving = Promise.resolve();
function save() {
  if (!dataKey || !db) return false;
  const key = dataKey, snapshot = te.encode(JSON.stringify(db));
  saving = saving.then(async () => { vault.data = await seal(await rawKey(key), snapshot); writeVault(); })
    .catch(() => toast("Enregistrement impossible. Faites une sauvegarde."));

}
async function openData(keyBytes) {
  db = normalize(JSON.parse(td.decode(await unseal(await rawKey(keyBytes), vault.data))));

}

/* Face ID / Touch ID via passkey + extension PRF (Safari iOS 18+) */
const bioPossible = () => window.top === window.self && !!window.PublicKeyCredential && !!navigator.credentials && window.isSecureContext;
async function prfSecret(credId, prfSalt) {
  const a = await navigator.credentials.get({ publicKey: { challenge: rand(32), allowCredentials: [{ type: "public-key", id: credId }],
    userVerification: "required", timeout: 60000, extensions: { prf: { eval: { first: prfSalt } } } } });
  const r = a.getClientExtensionResults().prf?.results?.first;
  if (!r) throw new Error("noprf");
  return new Uint8Array(r);
}
async function enableBio() {
  const prfSalt = rand(32);
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: rand(32), rp: { name: "Carnet" }, user: { id: rand(16), name: "carnet", displayName: "Carnet" },
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: "platform", residentKey: "preferred", userVerification: "required" },
    timeout: 60000, extensions: { prf: { eval: { first: prfSalt } } } } });
  const ext = cred.getClientExtensionResults().prf;
  if (ext && ext.enabled === false) throw new Error("noprf");
  const secret = ext?.results?.first ? new Uint8Array(ext.results.first) : await prfSecret(new Uint8Array(cred.rawId), prfSalt);
  vault.bio = { id: b64(cred.rawId), salt: b64(prfSalt), ...(await seal(await rawKey(secret), dataKey)) };
  writeVault();
}
async function unlockBio() {
  const secret = await prfSecret(unb64(vault.bio.id), unb64(vault.bio.salt));
  await openData(await unseal(await rawKey(secret), vault.bio));
}

/* ---------- Temps de service : vacations + formations, plafond annuel ---------- */
function formationDays(f) {
  if (f.statut === "annule" || f.compte === false) return [];
  const out = [], end = f.fin || f.debut;
  for (let d = f.debut; d <= end && out.length < 400; d = addDays(d, 1)) {
    const wd = parse(d).getDay();
    if (f.weekend || (wd !== 0 && wd !== 6)) out.push(d);
  }
  return out;
}
const formationMinPerDay = f => Math.round((f.heuresJour === undefined || f.heuresJour === "" ? 7 : Number(f.heuresJour) || 0) * 60);
function serviceUnits() {
  const u = db.vacations.map(v => ({ date: v.date, min: duration(v.debut, v.fin, v.pause), kind: "vacation" }));
  db.formations.forEach(f => { const m = formationMinPerDay(f); formationDays(f).forEach(d => u.push({ date: d, min: m, kind: "formation" })); });
  return u;
}
function contractPeriod(ref = todayIso()) {
  const c = db.settings.contratDebut;
  if (!c) return null;
  const [, mm, dd] = c.split("-").map(Number);
  const r = parse(ref);
  let y = r.getFullYear();
  const anniv = y2 => iso(new Date(y2, mm - 1, dd));
  if (ref < anniv(y)) y--;
  return { start: anniv(y), end: addDays(anniv(y + 1), -1) };
}
function contractStats() {
  const per = contractPeriod();
  if (!per) return null;
  const t = todayIso(), cap = Math.round((Number(db.settings.plafond) || 0) * 60);
  let done = 0, plan = 0, form = 0;
  serviceUnits().forEach(x => {
    if (x.date < per.start || x.date > per.end) return;
    if (x.date <= t) done += x.min; else plan += x.min;
    if (x.kind === "formation") form += x.min;
  });
  return { ...per, cap, done, plan, form, left: cap - done - plan };
}
const fmtD = s => { const d = parse(s); return `${d.getDate()} ${MOIS_C[d.getMonth()]} ${d.getFullYear()}`; };
function contractCard() {

    <div class="field"><label for="cCap">Plafond (heures)</label><input id="cCap" type="number" min="0" step="1" inputmode="numeric" value="${esc(db.settings.plafond)}"></div></div></div>`;
  const pct = x => c.cap ? Math.max(0, Math.min(100, x / c.cap * 100)) : 0;
  const over = c.left < 0;
  return `<div class="card">
    <div class="section-head"><h2>Plafond ${parse(c.start).getFullYear()}–${parse(c.end).getFullYear()}</h2><span class="mono">${fmtH(c.done)} / ${fmtH(c.cap)}</span></div>
    <div class="progress"><i style="width:${pct(c.done)}%"></i><i class="plan" style="width:${pct(c.plan)}%"></i>${over ? `<i class="over" style="width:4%"></i>` : ""}</div>
    <div class="hint">Du ${fmtD(c.start)} au ${fmtD(c.end)} · effectuées ${fmtH(c.done)} · programmées ${fmtH(c.plan)}${c.form ? ` · dont formation ${fmtH(c.form)}` : ""}</div>
    <span class="pill ${over ? "crit" : c.left < 7 * 60 ? "warn" : "ok"}" style="align-self:flex-start">${over ? `Dépassement de ${fmtH(-c.left)}` : `Reste ${fmtH(c.left)} à programmer`}</span>

  ${obj ? `<div class="card"><div class="section-head"><h2>Tir ${y}</h2><span class="mono">${tirsFaits} / ${obj}</span></div>
    <div class="progress"><i style="width:${Math.min(100, tirsFaits/obj*100)}%"></i></div>
    <span class="hint">Séances effectuées cette année sur l'objectif que vous avez fixé.</span></div>` : ""}`;
}

function calendar() {
  const { y, m } = calMonth;
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const t = todayIso();
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const s = iso(d);
    const vs = db.vacations.filter(v => v.date === s);
    const tirs = db.tirs.some(x => x.date === s);
    const forms = db.formations.some(f => f.debut <= s && (f.fin || f.debut) >= s && f.statut !== "annule");
    const dots = [...vs.map(v => svc(v.serviceId)?.color || "var(--muted)"), ...(tirs ? ["var(--crit)"] : []), ...(forms ? ["var(--warn)"] : [])].slice(0, 3);
    const label = `${d.getDate()} ${MOIS[d.getMonth()]}${vs.length ? ", " + vs.length + " vacation" : ""}${tirs ? ", tir" : ""}${forms ? ", formation" : ""}`;
    cells += `<button class="day ${d.getMonth() !== m ? "out" : ""} ${s === t ? "today" : ""} ${dots.length ? "has" : ""}" data-day="${s}" aria-label="${label}">
      ${d.getDate()}<span class="dots">${dots.map(c => `<i style="--c:${c}"></i>`).join("")}</span></button>`;
  }
  const legend = db.services.map(s => `<span><i style="--c:${s.color}"></i>${esc(s.nom)}</span>`).join("") +
    `<span><i style="--c:var(--crit)"></i>Tir</span><span><i style="--c:var(--warn)"></i>Formation</span>`;
  return `<div class="cal"><div class="cal-head">
      <button class="btn ghost" data-cal="-1" aria-label="Mois précédent">‹</button>
      <b>${MOIS[m]} ${y}</b>
      <button class="btn ghost" data-cal="1" aria-label="Mois suivant">›</button></div>
    <div class="cal-grid">${["L","M","M","J","V","S","D"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="legend">${legend}</div></div>`;
}

function renderVacations() {
  const sorted = [...db.vacations].sort((a, b) => b.date.localeCompare(a.date));
  const groups = {};
  sorted.forEach(v => { const k = v.date.slice(0, 7); (groups[k] ||= []).push(v); });
  const keys = Object.keys(groups);
  if (!keys.length) return `${exampleBanner()}<div class="list"><div class="empty">Aucune vacation. Touchez + pour saisir votre première vacation.</div></div>`;
  return exampleBanner() + keys.map(k => {
    const [y, m] = k.split("-").map(Number);
    const tot = groups[k].reduce((a, v) => a + duration(v.debut, v.fin, v.pause), 0);
    return `<div class="section-head"><h2>${MOIS[m-1]} ${y}</h2><span class="mono">${groups[k].length} j · ${fmtH(tot)}</span></div>
      <div class="list">${groups[k].map(vacItem).join("")}</div>`;
  }).join("");
}

function renderTir() {
  const y = new Date().getFullYear();
  const t = todayIso();
  const prevus = db.tirs.filter(x => x.statut !== "fait").sort((a, b) => a.date.localeCompare(b.date));
  const faits = db.tirs.filter(x => x.statut === "fait").sort((a, b) => b.date.localeCompare(a.date));
  const nb = faits.filter(x => parse(x.date).getFullYear() === y).length;
  const obj = Number(db.settings.tirObjectif) || 0;
  const last = faits[0];
  return `${exampleBanner()}
  <div class="card">
    <div class="section-head"><h2>Objectif ${y}</h2><span class="mono">${nb} / ${obj || "–"}</span></div>
    ${obj ? `<div class="progress"><i style="width:${Math.min(100, nb/obj*100)}%"></i></div>` : ""}
    <div class="hint">${last ? `Dernière séance : ${parse(last.date).getDate()} ${MOIS[parse(last.date).getMonth()]} ${parse(last.date).getFullYear()} (il y a ${-daysUntil(last.date)} jours).` : "Aucune séance enregistrée."}</div>
    <div class="row2" style="align-items:end"><div class="field"><label for="tirObj">Séances visées par an</label>
      <input id="tirObj" type="number" min="0" max="12" inputmode="numeric" value="${obj}"></div>
      <span class="hint">À ajuster selon les consignes de votre unité.</span></div>
  </div>
  <div class="section-head"><h2>Programmés</h2></div>
  ${listOr(prevus, tirItem, "Aucun recyclage programmé.")}
  <div class="section-head"><h2>Effectués</h2></div>
  ${listOr(faits, tirItem, "Aucune séance effectuée enregistrée.")}`;
}

function renderFormations() {
  const t = todayIso();
  const a = db.formations.filter(f => (f.fin || f.debut) >= t && f.statut === "prevu").sort((x, y) => x.debut.localeCompare(y.debut));
  const b = db.formations.filter(f => !a.includes(f)).sort((x, y) => y.debut.localeCompare(x.debut));
  return `${exampleBanner()}
  <div class="section-head"><h2>Programmées</h2></div>${listOr(a, formItem, "Aucune formation programmée.")}
  <div class="section-head"><h2>Historique</h2></div>${listOr(b, formItem, "Aucune formation passée.")}`;
}

  <div class="list">${items.length ? items.join("") : `<div class="empty">Ajoutez les services où vous êtes affecté.</div>`}</div>
  <div class="card">

    <div class="field"><label for="cCap">Plafond (heures)</label><input id="cCap" type="number" min="0" step="1" inputmode="numeric" value="${esc(db.settings.plafond)}"></div></div>
  </div>
  <div class="card">
    <h2>Sécurité</h2>
    <span class="hint">Vos données sont chiffrées sur cet iPhone. Le carnet se verrouille après 1 min en arrière-plan ou 5 min sans action.</span>

    <div class="actions"><button class="btn primary" id="calAll2">Ajouter tout le planning à venir</button></div>
  </div>

    <textarea class="backup" id="backupBox" hidden aria-label="Sauvegarde"></textarea>

function render() {
  if (!db) return;
  document.getElementById("brandTitle").textContent = db.settings.titre || "Mon carnet";

/* ---------- Forms ---------- */
const sheetRoot = document.getElementById("sheetRoot");
function closeSheet() { sheetRoot.innerHTML = ""; }
function openSheet(title, body, onSubmit, onDelete, kind, existing) {
  sheetRoot.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="grip"></div><form id="f" novalidate><h2>${esc(title)}</h2>${body}
    ${kind ? `<label class="check"><input type="checkbox" id="autoCal" ${autoCal ? "checked" : ""}> Ajouter à mon agenda iPhone en enregistrant</label>` : ""}
    <div class="actions">${onDelete ? `<button type="button" class="btn danger" id="del">Supprimer</button>` : ""}${existing ? `<button type="button" class="btn" id="calOne">Agenda</button>` : ""}
      <div class="right"><button type="button" class="btn" id="cancel">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></div>
    <div class="confirm" id="confirmDel" hidden>Supprimer définitivement ?<button type="button" class="btn danger" id="delYes">Oui, supprimer</button><button type="button" class="btn" id="delNo">Non</button></div>
    </form></div></div>`;
  const f = document.getElementById("f");
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  document.getElementById("cancel").onclick = closeSheet;
  if (onDelete) {
    document.getElementById("del").onclick = () => { document.getElementById("confirmDel").hidden = false; };
    document.getElementById("delNo").onclick = () => { document.getElementById("confirmDel").hidden = true; };
    document.getElementById("delYes").onclick = () => { onDelete(); commit("Supprimé"); };
  }
  if (existing) document.getElementById("calOne").onclick = () => sendToCalendar([[kind, existing]]);
  f.addEventListener("submit", e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(f));
    const res = onSubmit(data);
    if (typeof res === "string") { toast(res); return; }
    const box = document.getElementById("autoCal");
    if (box) { autoCal = box.checked; try { localStorage.setItem(KEY + "-autocal", autoCal ? "1" : "0"); } catch (err) {} }
    commit("Enregistré");
    if (box && box.checked && res) sendToCalendar([[kind, res]]);
  });
  return f;
}
function commit(msg) { db.example = db.example && [...db.vacations, ...db.tirs, ...db.formations, ...db.services].some(o => o.example); save(); closeSheet(); render(); toast(msg); }
function upsert(list, obj) { const i = list.findIndex(o => o.id === obj.id); if (i >= 0) list[i] = obj; else list.push(obj); return obj; }
const opt = (v, cur, label) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label ?? v)}</option>`;

function vacationForm(v, presetDate) {
  const isNew = !v;
  v ||= { id: uid(), date: presetDate || todayIso(), debut: "07:00", fin: "15:00", pause: 30, serviceId: db.services[0]?.id || "", note: "" };
  const body = `
    <div class="field"><label for="vDate">Date</label><input id="vDate" name="date" type="date" value="${v.date}" required></div>
    <div class="row3">
      <div class="field"><label for="vDeb">Début</label><input id="vDeb" name="debut" type="time" value="${v.debut}"></div>
      <div class="field"><label for="vFin">Fin</label><input id="vFin" name="fin" type="time" value="${v.fin}"></div>
      <div class="field"><label for="vPause">Pause (min)</label><input id="vPause" name="pause" type="number" min="0" step="5" inputmode="numeric" value="${v.pause}"></div>
    </div>
    <div class="calc" id="vCalc"><span class="hint">Durée effective<span class="sub" id="vLeft"></span></span><b id="vDur">${fmtH(duration(v.debut, v.fin, v.pause))}</b></div>
    <div class="field"><label for="vSvc">Service d'affectation</label><select id="vSvc" name="serviceId">
      ${db.services.map(s => opt(s.id, v.serviceId, s.nom + (s.unite ? " · " + s.unite : ""))).join("")}${opt("", v.serviceId, "— Non renseigné —")}</select></div>
    <div class="field"><label for="vNote">Note</label><textarea id="vNote" name="note" placeholder="Équipage, mission, indicatif…">${esc(v.note)}</textarea></div>`;
  const f = openSheet(isNew ? "Nouvelle vacation" : "Modifier la vacation", body, d => {
    if (!d.date) return "Indiquez la date de la vacation.";
    return upsert(db.vacations, { ...v, ...d, pause: Number(d.pause) || 0, example: false });
  }, isNew ? null : () => { db.vacations = db.vacations.filter(x => x.id !== v.id); }, "vacation", isNew ? null : v);
  const upd = () => {
    const dur = duration(f.debut.value, f.fin.value, f.pause.value);
    document.getElementById("vDur").textContent = fmtH(dur);
    const per = f.date.value ? contractPeriod(f.date.value) : null, el = document.getElementById("vLeft");
    if (!per) { el.textContent = ""; return; }
    const cap = Math.round((Number(db.settings.plafond) || 0) * 60);
    const used = serviceUnits().filter(x => x.date >= per.start && x.date <= per.end).reduce((a, x) => a + x.min, 0)
      - (isNew || v.date < per.start || v.date > per.end ? 0 : duration(v.debut, v.fin, v.pause));
    const left = cap - used - dur;
    el.textContent = left >= 0 ? `Il restera ${fmtH(left)} sur ${fmtH(cap)}` : `Dépasse le plafond de ${fmtH(-left)}`;
    document.getElementById("vCalc").classList.toggle("warn", left < 0);
  };
  ["date","debut","fin","pause"].forEach(n => f[n].addEventListener("input", upd)); upd();
}

function tirForm(t) {

  t ||= { id: uid(), date: todayIso(), lieu: "", type: "Séance de tir", statut: "prevu", note: "" };
  const types = ["Séance de tir", "Recyclage arme de poing", "Recyclage arme longue", "Tir de qualification", "Autre"];
  const body = `

    <div class="field"><label for="tSt">Statut</label><select id="tSt" name="statut">${opt("prevu", t.statut, "Prévu")}${opt("fait", t.statut, "Effectué")}</select></div></div>
    <div class="field"><label for="tType">Type</label><select id="tType" name="type">${types.map(x => opt(x, t.type)).join("")}${types.includes(t.type) ? "" : opt(t.type, t.type)}</select></div>
    <div class="field"><label for="tLieu">Lieu / stand</label><input id="tLieu" name="lieu" value="${esc(t.lieu)}" placeholder="Stand de tir…"></div>
    <div class="field"><label for="tNote">Note</label><textarea id="tNote" name="note" placeholder="Résultat, moniteur, convocation…">${esc(t.note)}</textarea></div>`;

}

function formationForm(fo) {
  const isNew = !fo;
  fo ||= { id: uid(), debut: todayIso(), fin: todayIso(), intitule: "", lieu: "", statut: "prevu", note: "" };
  const body = `
    <div class="field"><label for="fInt">Intitulé</label><input id="fInt" name="intitule" value="${esc(fo.intitule)}" placeholder="Ex. secourisme, procédure…"></div>
    <div class="row2"><div class="field"><label for="fDeb">Du</label><input id="fDeb" name="debut" type="date" value="${fo.debut}"></div>
    <div class="field"><label for="fFin">Au</label><input id="fFin" name="fin" type="date" value="${fo.fin || fo.debut}"></div></div>
    <div class="row2"><div class="field"><label for="fLieu">Lieu</label><input id="fLieu" name="lieu" value="${esc(fo.lieu)}"></div>
    <div class="field"><label for="fSt">Statut</label><select id="fSt" name="statut">${opt("prevu", fo.statut, "Programmée")}${opt("fait", fo.statut, "Suivie")}${opt("annule", fo.statut, "Annulée")}</select></div></div>
    <label class="check"><input type="checkbox" id="fCompte" name="compte" ${fo.compte === false ? "" : "checked"}> Compte comme temps de vacation</label>
    <div class="row2"><div class="field"><label for="fH">Heures par jour</label><input id="fH" name="heuresJour" type="number" min="0" max="24" step="0.5" inputmode="decimal" value="${fo.heuresJour ?? 7}"></div>
    <label class="check" style="align-self:end"><input type="checkbox" id="fWe" name="weekend" ${fo.weekend ? "checked" : ""}> Compter samedi et dimanche</label></div>
    <div class="calc" id="fCalc"></div>
    <div class="field"><label for="fNote">Note</label><textarea id="fNote" name="note">${esc(fo.note)}</textarea></div>`;
  const read = d => ({ ...fo, ...d, fin: d.fin || d.debut, compte: d.compte === "on", weekend: d.weekend === "on", heuresJour: Number(d.heuresJour) || 0, example: false });
  const f = openSheet(isNew ? "Nouvelle formation" : "Formation", body, d => {

  const upd = () => {
    const o = read(Object.fromEntries(new FormData(f)));

    document.getElementById("fCalc").innerHTML = o.compte
      ? `<span class="hint">Temps de vacation<span class="sub">${n} jour${n > 1 ? "s" : ""} × ${fmtH(formationMinPerDay(o))}</span></span><b>${fmtH(n * formationMinPerDay(o))}</b>`
      : `<span class="hint">Non comptée dans vos heures</span><b>0h00</b>`;
  };
  f.addEventListener("input", upd); f.addEventListener("change", upd); upd();
}

function serviceForm(s) {
  const isNew = !s;

    ${used && !isNew ? `<span class="hint">${used} vacation(s) liée(s). En cas de suppression, elles resteront sans service.</span>` : ""}`;
  openSheet(isNew ? "Nouveau service" : "Service", body, d => {

  }, isNew ? null : () => { db.services = db.services.filter(x => x.id !== s.id); db.vacations.forEach(v => { if (v.serviceId === s.id) v.serviceId = ""; }); });
}

function dayChoice(s) {
  const d = parse(s);
  const vs = db.vacations.filter(v => v.date === s);
  const ts = db.tirs.filter(x => x.date === s);
  const fs = db.formations.filter(f => f.debut <= s && (f.fin || f.debut) >= s);
  if (!vs.length && !ts.length && !fs.length) { vacationForm(null, s); return; }
  sheetRoot.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Journée">
    <div class="grip"></div><div style="display:flex;flex-direction:column;gap:12px">
    <h2>${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}</h2>
    <div class="list">${[...vs.map(vacItem), ...ts.map(tirItem), ...fs.map(formItem)].join("")}</div>
    <div class="actions"><button class="btn" id="cancel">Fermer</button><button class="btn primary" id="addHere">Ajouter une vacation ce jour</button></div></div></div></div>`;
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  document.getElementById("cancel").onclick = closeSheet;
  document.getElementById("addHere").onclick = () => vacationForm(null, s);
  sheetRoot.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => edit(b.dataset.edit, b.dataset.id)));
}

function edit(kind, id) {
  if (kind === "vacation") vacationForm(db.vacations.find(x => x.id === id));
  if (kind === "tir") tirForm(db.tirs.find(x => x.id === id));
  if (kind === "formation") formationForm(db.formations.find(x => x.id === id));
  if (kind === "service") serviceForm(db.services.find(x => x.id === id));
}

let toastTimer;
function toast(msg) {
  const r = document.getElementById("toastRoot");
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => r.innerHTML = "", 2600);
}

/* ---------- Events ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));
document.getElementById("addBtn").addEventListener("click", () => {
  ({ accueil: () => vacationForm(), vacations: () => vacationForm(), tir: () => tirForm(), formations: () => formationForm(), services: () => serviceForm() })[tab]();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

view.addEventListener("click", e => {
  const ed = e.target.closest("[data-edit]"); if (ed) { edit(ed.dataset.edit, ed.dataset.id); return; }
  const day = e.target.closest("[data-day]"); if (day) { dayChoice(day.dataset.day); return; }
  const cal = e.target.closest("[data-cal]");
  if (cal) { let m = calMonth.m + Number(cal.dataset.cal), y = calMonth.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } calMonth = { y, m }; render(); return; }
  if (e.target.id === "calAll" || e.target.id === "calAll2") { sendToCalendar(upcomingEntries()); return; }
  if (e.target.id === "lockNow") { lockApp(); return; }
  if (e.target.id === "chgPin") { flow = { mode: "change1" }; showLock(); return; }
  if (e.target.id === "newRc") { flow = { mode: "rcnew" }; showLock(); return; }
  if (e.target.id === "bioOff") { delete vault.bio; writeVault(); render(); toast("Face ID désactivé."); return; }
  if (e.target.id === "bioOn") {
    enableBio().then(() => { render(); toast("Face ID activé."); }, err => toast(bioError(err)));
    return;
  }
  if (e.target.id === "clearEx") {
    db.vacations = db.vacations.filter(o => !o.example); db.tirs = db.tirs.filter(o => !o.example);
    db.formations = db.formations.filter(o => !o.example); db.services = db.services.filter(o => !o.example);
    db.example = false; save(); render(); toast("Exemples effacés. Commencez par ajouter vos services.");
  }
  if (e.target.id === "exportBtn") {
    const txt = JSON.stringify(db);
    const box = document.getElementById("backupBox"); box.hidden = false; box.value = txt; document.getElementById("importActions").hidden = true;
    const done = () => toast("Sauvegarde copiée. Collez-la dans Notes ou un mail.");
    const fallback = () => { box.focus(); box.select(); toast("Sélectionnez le texte puis copiez-le."); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (err) { fallback(); }
  }
  if (e.target.id === "importBtn") {
    const box = document.getElementById("backupBox"); box.hidden = false; box.value = ""; box.placeholder = "Collez ici le texte de sauvegarde"; box.focus();
    document.getElementById("importActions").hidden = false;
  }
  if (e.target.id === "importGo") {
    try {
      const d = JSON.parse(document.getElementById("backupBox").value);
      if (!Array.isArray(d.vacations) || !Array.isArray(d.services)) throw 0;
      db = normalize(d); save(); render(); toast("Données restaurées.");
    } catch (err) { toast("Ce texte n'est pas une sauvegarde valide du carnet."); }
  }
});
view.addEventListener("change", e => {
  if (e.target.id === "tirObj") { db.settings.tirObjectif = Math.max(0, Number(e.target.value) || 0); save(); render(); }
  if (e.target.id === "cDeb") { db.settings.contratDebut = e.target.value; save(); render(); toast("Enregistré"); }
  if (e.target.id === "cCap") { db.settings.plafond = Math.max(0, Number(e.target.value) || 0); save(); render(); toast("Enregistré"); }
  if (e.target.id === "pTitre" || e.target.id === "pSous") {
    db.settings[e.target.id === "pTitre" ? "titre" : "sousTitre"] = e.target.value.trim(); save(); render(); toast("Enregistré");
  }
});

/* ---------- Écran de verrouillage ---------- */
const lockEl = document.getElementById("lock");
const appParts = () => [document.querySelector("header.top"), document.querySelector("main"), document.querySelector("nav.tabs")];
let flow = null, pin = "", busy = false;
const BADGE = document.querySelector(".mono-badge").outerHTML;

function showApp() { lockEl.hidden = true; lockEl.innerHTML = ""; appParts().forEach(el => el.hidden = false); flow = null; lastAct = Date.now(); render(); }
function showLock() { closeSheet(); appParts().forEach(el => el.hidden = true); lockEl.hidden = false; pin = ""; drawLock(); }
function lockApp() { dataKey = null; db = null; view.innerHTML = ""; flow = { mode: "unlock" }; appParts().forEach(el => el.hidden = true); showLock(); }

const ICON_FACE = `<svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9v1.5M15 9v1.5M12 9v4h-1M9.5 16c1.5 1 3.5 1 5 0"/></svg>`;
const ICON_DEL = `<svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>`;

const TEXTS = {
  set1: ["Étape 1 sur 4", "Choisissez un code à 6 chiffres", "Il protège et chiffre vos données sur cet iPhone."],
  set2: ["Étape 1 sur 4", "Confirmez votre code", ""],
  unlock: ["", "Entrez votre code", ""],
  rec2: ["Code de secours accepté", "Choisissez un nouveau code", "Vos données sont conservées."],
  rec3: ["", "Confirmez le nouveau code", ""],
  change1: ["Changer le code", "Nouveau code à 6 chiffres", ""],
  change2: ["Changer le code", "Confirmez le nouveau code", ""],
};

function drawLock(err = "") {
  const m = flow.mode;
  if (TEXTS[m]) return drawKeypad(err);
  if (m === "showrc") return drawRecoveryShow();
  if (m === "perso") return drawPerso();
  if (m === "bio") return drawBioOffer(err);
  if (m === "rec1") return drawRecoveryEntry(err);
  if (m === "rcnew") return drawRcNew();
}
function head(steps, title) {
  return `${steps ? `<div class="steps">${esc(steps)}</div>` : ""}${BADGE}<h1>${esc(title)}</h1>`;
}
function drawKeypad(err) {
  const [steps, prompt, sub] = TEXTS[flow.mode];
  const canBio = flow.mode === "unlock" && vault?.bio && bioPossible();
  const fails = vault?.fails || 0, wait = Math.max(0, Math.ceil(((vault?.until || 0) - Date.now()) / 1000));
  const keys = [1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}" aria-label="${n}">${n}</button>`).join("") +
    (canBio ? `<button class="plain" data-k="bio" aria-label="Face ID">${ICON_FACE}</button>` : (flow.mode.startsWith("change") ? `<button class="plain" data-k="cancel">Annuler</button>` : `<button class="void" tabindex="-1" aria-hidden="true"></button>`)) +
    `<button data-k="0" aria-label="0">0</button><button class="plain" data-k="del" aria-label="Effacer">${ICON_DEL}</button>`;
  lockEl.innerHTML = `<div class="lk">${head(steps, "Carnet")}
    <div class="prompt">${esc(prompt)}</div>${sub ? `<p>${esc(sub)}</p>` : ""}
    <div class="pdots${err ? " shake" : ""}" aria-label="${pin.length} chiffres saisis sur 6">${[0,1,2,3,4,5].map(i => `<i class="${i < pin.length ? "on" : ""}"></i>`).join("")}</div>
    <div class="err" role="alert">${esc(wait > 0 && flow.mode === "unlock" ? `Trop d'essais. Réessayez dans ${wait} s.` : err)}</div>
    <div class="keypad">${keys}</div>
    ${flow.mode === "unlock" ? `<button class="link" data-k="forgot">Code oublié ?</button>` : ""}
    ${flow.mode === "unlock" && fails ? `<p>${fails} essai${fails > 1 ? "s" : ""} incorrect${fails > 1 ? "s" : ""}</p>` : ""}
  </div>`;
  if (wait > 0 && flow.mode === "unlock") setTimeout(() => { if (flow?.mode === "unlock") drawLock(); }, 1000);
}
function drawRecoveryShow() {
  lockEl.innerHTML = `<div class="lk">${head(flow.setup ? "Étape 2 sur 4" : "Nouveau code de secours", "Code de secours")}
    <p>Si vous oubliez votre code, ce code de secours permet d'en choisir un nouveau sans perdre vos données. Notez-le en dehors de cette app : note verrouillée, trousseau de mots de passe ou papier.</p>
    <div class="rcode" id="rcText">${esc(flow.rc)}</div>
    <button class="btn ghostl" data-k="copyrc">Copier le code</button>
    <label class="chk"><input type="checkbox" id="rcOk"> J'ai noté mon code de secours</label>
    <button class="btn primary" data-k="rcdone" id="rcDone" disabled>Continuer</button>
    <p>Il ne sera plus affiché. Sans lui ni votre code, les données ne peuvent pas être récupérées.</p>
  </div>`;
  document.getElementById("rcOk").addEventListener("change", e => { document.getElementById("rcDone").disabled = !e.target.checked; });
}
function drawPerso() {
  lockEl.innerHTML = `<div class="lk">${head("Étape 3 sur 4", "Votre carnet")}
    <p>Ces textes s'affichent uniquement une fois le carnet déverrouillé. Ils sont chiffrés, rien n'apparaît en clair.</p>
    <label class="f">Nom du carnet<input type="text" id="sTitre" placeholder="Mon carnet" value="${esc(db.settings.titre)}"></label>
    <label class="f">Sous-titre<input type="text" id="sSous" placeholder="Facultatif" value="${esc(db.settings.sousTitre)}"></label>
    <button class="btn primary" data-k="persodone">Continuer</button>
  </div>`;
}
function drawBioOffer(err) {
  lockEl.innerHTML = `<div class="lk">${head("Étape 4 sur 4", "Face ID")}
    <p>Déverrouillez le carnet d'un regard. Le code reste disponible en secours. Une clé d'accès nommée « Carnet » sera enregistrée dans votre trousseau iCloud.</p>
    <div class="err" role="alert">${esc(err)}</div>
    <button class="btn primary" data-k="bioyes">Activer Face ID</button>
    <button class="btn ghostl" data-k="biono">Plus tard</button>
  </div>`;
}
function drawRecoveryEntry(err) {
  lockEl.innerHTML = `<div class="lk">${head("", "Code oublié")}
    <p>Saisissez votre code de secours (16 caractères). Vous pourrez ensuite choisir un nouveau code, vos données sont conservées.</p>
    <input type="text" id="rcIn" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" aria-label="Code de secours">
    <div class="err" role="alert">${esc(err)}</div>
    <button class="btn primary" data-k="rcgo">Valider</button>
    <button class="link" data-k="back">Retour au code</button>
  </div>`;
  document.getElementById("rcIn").focus();
}
function drawRcNew() {
  lockEl.innerHTML = `<div class="lk">${head("", "Nouveau code de secours")}
    <p>L'ancien code de secours ne fonctionnera plus.</p>
    <button class="btn primary" data-k="rcgen">Générer un nouveau code</button>
    <button class="btn ghostl" data-k="cancel">Annuler</button>
  </div>`;
}

async function onPinComplete() {
  const m = flow.mode, code = pin;
  busy = true;
  try {
    if (m === "set1" || m === "rec2" || m === "change1") { flow = { ...flow, first: code, mode: { set1: "set2", rec2: "rec3", change1: "change2" }[m] }; pin = ""; drawLock(); return; }
    if (m === "set2" || m === "rec3" || m === "change2") {
      if (code !== flow.first) { flow.mode = { set2: "set1", rec3: "rec2", change2: "change1" }[m]; pin = ""; drawLock("Les codes ne correspondent pas. Recommencez."); return; }
      if (m === "set2") {
        const keyBytes = rand(32), rc = newRecoveryCode();
        let legacy = null; try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "null"); } catch (e) {}
        db = normalize(legacy); dataKey = keyBytes;
        vault = { v: 2, pin: await wrapSecret(code, keyBytes), rec: await wrapSecret(normRC(rc), keyBytes), fails: 0, until: 0 };
        vault.data = await seal(await rawKey(keyBytes), te.encode(JSON.stringify(db)));
        if (writeVault()) { try { localStorage.removeItem(LEGACY_KEY); } catch (e) {} }
        flow = { mode: "showrc", rc, setup: true }; drawLock(); return;
      }
      vault.pin = await wrapSecret(code, dataKey); vault.fails = 0; vault.until = 0; writeVault();
      if (m === "rec3") { showApp(); toast("Nouveau code enregistré."); }
      else { showApp(); toast("Code modifié."); }
      return;
    }
    if (m === "unlock") {
      if ((vault.until || 0) > Date.now()) { pin = ""; drawLock(); return; }
      try { await openData(await unwrapSecret(code, vault.pin)); vault.fails = 0; vault.until = 0; writeVault(); showApp(); }
      catch (e) {
        vault.fails = (vault.fails || 0) + 1;
        if (vault.fails >= 5) vault.until = Date.now() + 30000 * Math.pow(2, Math.min(vault.fails - 5, 5));
        writeVault(); pin = ""; drawLock("Code incorrect.");
      }
    }
  } finally { busy = false; }
}

lockEl.addEventListener("click", async e => {
  const b = e.target.closest("[data-k]"); if (!b || busy) return;
  const k = b.dataset.k;
  if (/^\d$/.test(k)) { if (pin.length < 6) { pin += k; drawLock(); if (pin.length === 6) { lockEl.querySelector(".prompt").textContent = "Vérification…"; setTimeout(onPinComplete, 30); } } return; }
  if (k === "del") { pin = pin.slice(0, -1); drawLock(); return; }
  if (k === "cancel") { showApp(); return; }
  if (k === "forgot") { flow = { mode: "rec1" }; drawLock(); return; }
  if (k === "back") { flow = { mode: "unlock" }; pin = ""; drawLock(); return; }
  if (k === "bio") {
    busy = true;
    try { await unlockBio(); showApp(); } catch (err) { pin = ""; drawLock(bioError(err)); } finally { busy = false; }
    return;
  }
  if (k === "copyrc") {
    try { await navigator.clipboard.writeText(flow.rc); b.textContent = "Code copié"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("rcText")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Sélectionné : copiez-le"; }
    return;
  }
  if (k === "rcdone") { if (flow.setup) { flow = { mode: "perso" }; drawLock(); } else { showApp(); toast("Nouveau code de secours actif."); } return; }
  if (k === "persodone") {
    db.settings.titre = document.getElementById("sTitre").value.trim(); db.settings.sousTitre = document.getElementById("sSous").value.trim(); save();
    if (bioPossible()) { flow = { mode: "bio" }; drawLock(); } else showApp();
    return;
  }
  if (k === "bioyes") {
    busy = true;
    try { await enableBio(); showApp(); toast("Face ID activé."); } catch (err) { drawLock(bioError(err)); } finally { busy = false; }
    return;
  }
  if (k === "biono") { showApp(); return; }
  if (k === "rcgen") {
    busy = true;
    try { const rc = newRecoveryCode(); vault.rec = await wrapSecret(normRC(rc), dataKey); writeVault(); flow = { mode: "showrc", rc }; drawLock(); } finally { busy = false; }
    return;
  }
  if (k === "rcgo") {
    const val = normRC(document.getElementById("rcIn").value);
    if (val.length !== 16) { drawLock("Le code de secours compte 16 caractères."); return; }
    busy = true; b.textContent = "Vérification…";
    try { await openData(await unwrapSecret(val, vault.rec)); flow = { mode: "rec2" }; pin = ""; drawLock(); }
    catch (err) { drawLock("Code de secours incorrect."); }
    finally { busy = false; }
  }
});
document.addEventListener("keydown", e => {
  if (lockEl.hidden || !flow || !TEXTS[flow.mode]) return;
  if (/^\d$/.test(e.key)) lockEl.querySelector(`[data-k="${e.key}"]`)?.click();
  if (e.key === "Backspace") lockEl.querySelector(`[data-k="del"]`)?.click();
});

/* Verrouillage automatique */
let lastAct = Date.now(), hiddenAt = 0;
["pointerdown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
setInterval(() => { if (dataKey && lockEl.hidden && Date.now() - lastAct > 5 * 60000) lockApp(); }, 15000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); document.body.classList.add("privacy"); }
  else {
    document.body.classList.remove("privacy");
    if (dataKey && Date.now() - hiddenAt > 60000) lockApp();
  }
});

function boot() {
  if (!window.crypto?.subtle) {
    lockEl.innerHTML = `<div class="lk">${BADGE}<h1>Carnet</h1><p>Ouvrez cette page dans Safari, à son adresse https, pour utiliser le carnet.</p></div>`;
    return;
  }
  vault = readVault();
  flow = vault ? { mode: "unlock" } : { mode: "set1" };
  showLock();
}
boot();
})();
</script>
