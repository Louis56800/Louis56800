<style>
/* Layout: one-column mobile app; night-blue duty band header with hi-vis chevrons, bottom tab bar, bottom-sheet forms */
:root {
  --bg: #e9edf3;
  --surface: #ffffff;
  --ink: #111a2b;
  --muted: #586378;
  --line: #d3d9e3;
  --accent: #1a2f5e;
  --accent-ink: #ffffff;
  --accent-soft: #e0e7f3;
  --band: #0d1a33;
  --band-2: #16274a;
  --band-ink: #f2f5fa;
  --band-muted: #9fb0cf;
  --hivis: #e6c32e;
  --hivis-ink: #0d1a33;
  --ok: #1d7a4c;
  --warn: #a8640a;
  --crit: #b3261e;
  --font-display: "Big Shoulders Display", "Arial Narrow", system-ui, sans-serif;
  --font-stencil: "Big Shoulders Stencil Display", "Big Shoulders Display", "Arial Narrow", sans-serif;
  --font-body: "Inter", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080d17; --surface: #111a2a; --ink: #e6ebf3; --muted: #95a2b8; --line: #243149;
    --accent: #9db7ec; --accent-ink: #0b1220; --accent-soft: #1a2740;
    --band: #050a14; --band-2: #0f1a30; --band-ink: #eef2f8; --band-muted: #8798b8;
    --hivis: #e9c93f; --hivis-ink: #0b1220;
    --ok: #5fc48f; --warn: #e3a64a; --crit: #ef7a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080d17; --surface: #111a2a; --ink: #e6ebf3; --muted: #95a2b8; --line: #243149;
  --accent: #9db7ec; --accent-ink: #0b1220; --accent-soft: #1a2740;
  --band: #050a14; --band-2: #0f1a30; --band-ink: #eef2f8; --band-muted: #8798b8;
  --hivis: #e9c93f; --hivis-ink: #0b1220;
  --ok: #5fc48f; --warn: #e3a64a; --crit: #ef7a72; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; color: var(--band-ink); overflow: hidden;
  background: linear-gradient(180deg, var(--band-2), var(--band)); }
header.top::after { content: ""; position: absolute; top: 0; bottom: 4px; right: -10px; width: 120px; pointer-events: none; opacity: .9;
  background: repeating-linear-gradient(-55deg, transparent 0 14px, var(--hivis) 14px 22px, transparent 22px 26px, color-mix(in srgb, var(--band-ink) 55%, transparent) 26px 28px, transparent 28px 42px);
  -webkit-mask: linear-gradient(90deg, transparent, #000 70%); mask: linear-gradient(90deg, transparent, #000 70%); }
header.top::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
  background: repeating-linear-gradient(90deg, var(--hivis) 0 28px, color-mix(in srgb, var(--band-ink) 70%, transparent) 28px 34px); }
header.top .wrap { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 16px; }
.id { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mono-badge { width: 42px; height: 42px; flex: none; }
.brand { font: 800 25px/.95 var(--font-stencil); letter-spacing: .04em; text-transform: uppercase; }
.brand small { display: block; font: 500 10.5px/1.2 var(--font-mono); letter-spacing: .14em; color: var(--band-muted); text-transform: uppercase; margin-top: 5px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; min-height: 42px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--crit); }
.btn.ghost { border-color: transparent; background: transparent; }
.add { width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--hivis); color: var(--hivis-ink); font: 700 28px/1 var(--font-display); display: grid; place-items: center; box-shadow: 0 0 0 3px color-mix(in srgb, var(--hivis) 25%, transparent); margin-right: 52px; }

main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
main .wrap { display: flex; flex-direction: column; gap: 18px; padding-block: 16px; }
h2 { font: 700 21px/1.05 var(--font-display); letter-spacing: .05em; text-transform: uppercase; margin: 0; text-wrap: balance; display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 4px; height: .85em; background: var(--hivis); transform: skewX(-18deg); flex: none; }
.sheet h2::before, .card h2::before { display: none; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hint { color: var(--muted); font-size: 13px; }

.banner { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 13px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; position: relative; overflow: hidden; }
.stat::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent); }
.stat:first-child { background: var(--band); color: var(--band-ink); border-color: var(--band); }
.stat:first-child::after { background: var(--hivis); }
.stat:first-child span { color: var(--band-muted); }
.stat b { display: block; font: 800 30px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.stat span { font-size: 10.5px; line-height: 1.3; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.item:first-child { border-top: 0; }
.date { text-align: center; border-right: 3px solid var(--svc, var(--line)); padding-right: 10px; }
.date b { display: block; font: 800 27px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.date span { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
.item .main { min-width: 0; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.pill { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.pill.crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.example { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); margin-left: 6px; }

/* Calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cal-head b { font: 700 20px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-grid .dow { font-size: 11px; color: var(--muted); text-align: center; text-transform: uppercase; padding-bottom: 2px; }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 8px; border: 1px solid transparent; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-variant-numeric: tabular-nums; font-size: 14px; padding: 0; }
.day.out { color: var(--muted); opacity: .4; }
.day.today { background: var(--band); color: var(--band-ink); font-weight: 700; box-shadow: inset 0 -3px 0 var(--hivis); }
.day.has { background: var(--accent-soft); }
.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 5px; }

/* Tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .row { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
nav.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button { position: relative; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--hivis); }
nav.tabs button[aria-current="page"] svg { stroke: var(--accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgb(8 12 20 / .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet form { display: flex; flex-direction: column; gap: 12px; }
.sheet { border-top: 4px solid var(--hivis); }
.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: -6px auto 6px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.field input, .field select, .field textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.calc { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
.calc b { font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-top: 4px; }
.actions .right { display: flex; gap: 8px; margin-left: auto; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--crit); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches label { position: relative; }
.swatches input { position: absolute; opacity: 0; }
.swatches span { display: block; width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 3px solid transparent; }
.swatches input:checked + span { border-color: var(--ink); }
.swatches input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.check { display: flex; gap: 10px; align-items: center; font-size: 14px; padding: 4px 0; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress { height: 10px; border-radius: 3px; }
.progress i { display: block; height: 100%; background: repeating-linear-gradient(-55deg, var(--hivis) 0 8px, color-mix(in srgb, var(--hivis) 70%, var(--band)) 8px 12px); }
textarea.backup { width: 100%; min-height: 120px; font: 12px/1.4 var(--font-mono); border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); }
@media (max-width: 380px) { .row3 { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6; } } }
</style>

<header class="top"><div class="wrap">
  <div class="id">
    <svg class="mono-badge" viewBox="0 0 48 48" aria-hidden="true">

      <path d="M24 8 38 15.5v17L24 40 10 32.5v-17z" fill="var(--band-2)" stroke="color-mix(in srgb, var(--band-ink) 35%, transparent)" stroke-width="1"/>
      <text x="24" y="29.5" text-anchor="middle" font-family="Big Shoulders Stencil Display, Arial Narrow, sans-serif" font-weight="800" font-size="16" fill="var(--band-ink)" letter-spacing="1">CR</text>

<script>
(() => {
const KEY = "carnet-reserve-v1";
const COLORS = ["#2f5fbf", "#1d8a5a", "#c2410c", "#7c3aed", "#b8860b", "#0e7490", "#be185d", "#4b5563"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_C = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
const JOURS = ["dim","lun","mar","mer","jeu","ven","sam"];

const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayIso = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtH = min => { const h = Math.floor(min/60), m = Math.round(min%60); return `${h}h${pad(m)}`; };
const daysUntil = s => Math.round((parse(s) - parse(todayIso())) / 86400000);

function duration(debut, fin, pause) {
  if (!debut || !fin) return 0;
  const [h1,m1] = debut.split(":").map(Number), [h2,m2] = fin.split(":").map(Number);
  let d = (h2*60+m2) - (h1*60+m1);
  if (d <= 0) d += 1440; // vacation de nuit, fin le lendemain
  return Math.max(0, d - (Number(pause)||0));
}

/* ---------- Agenda (.ics) ---------- */
const icsEsc = s => String(s ?? "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\;");
const icsDate = s => s.replace(/-/g, "");
const icsDT = (s, hm) => icsDate(s) + "T" + hm.replace(":", "") + "00";
function fold(line) { const out = []; while (line.length > 72) { out.push(line.slice(0, 72)); line = " " + line.slice(72); } out.push(line); return out.join("\r\n"); }
function vevent(kind, o) {
  const L = ["BEGIN:VEVENT", `UID:${kind}-${o.id}@carnet-reserve`, "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
    "SEQUENCE:" + Math.floor(Date.now() / 1000)];
  let alarm, summary, desc = [], loc = "";
  if (kind === "vacation") {
    const s = svc(o.serviceId);
    const endDate = duration(o.debut, o.fin, 0) + (Number(o.debut.split(":")[0]) * 60 + Number(o.debut.split(":")[1])) >= 1440 ? addDays(o.date, 1) : o.date;
    L.push("DTSTART:" + icsDT(o.date, o.debut), "DTEND:" + icsDT(endDate, o.fin));
    summary = "Vacation réserve · " + (s?.nom || "service non renseigné");
    loc = s?.unite || "";
    desc.push("Durée effective : " + fmtH(duration(o.debut, o.fin, o.pause)) + (o.pause ? ` (pause ${o.pause} min)` : ""));
    alarm = "-PT2H";
  } else if (kind === "tir") {
    L.push("DTSTART;VALUE=DATE:" + icsDate(o.date), "DTEND;VALUE=DATE:" + icsDate(addDays(o.date, 1)));
    summary = "Tir · " + o.type; loc = o.lieu; alarm = "-PT15H";
    if (o.statut === "fait") desc.push("Séance effectuée");
  } else {
    L.push("DTSTART;VALUE=DATE:" + icsDate(o.debut), "DTEND;VALUE=DATE:" + icsDate(addDays(o.fin || o.debut, 1)));
    summary = "Formation · " + o.intitule; loc = o.lieu; alarm = "-PT15H";
    if (o.statut === "annule") L.push("STATUS:CANCELLED");
  }
  if (o.note) desc.push(o.note);
  L.push("SUMMARY:" + icsEsc(summary));
  if (loc) L.push("LOCATION:" + icsEsc(loc));
  if (desc.length) L.push("DESCRIPTION:" + icsEsc(desc.join("\n")));
  L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(summary), "TRIGGER:" + alarm, "END:VALARM", "END:VEVENT");
  return L.map(fold).join("\r\n");
}
function sendToCalendar(entries) {
  if (!entries.length) { toast("Aucun événement à envoyer."); return; }
  if (window.top !== window.self) { calendarHelp(); return; }
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Carnet de reserve//FR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    ...entries.map(([k, o]) => vevent(k, o)), "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
  document.body.appendChild(a); a.click(); a.remove();
}
function calendarHelp() {
  sheetRoot.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Agenda iPhone">
    <div class="grip"></div><div style="display:flex;flex-direction:column;gap:12px">
    <h2>Agenda iPhone</h2>
    <p style="margin:0">L'envoi vers l'agenda fonctionne dans la version installée du carnet, ouverte directement dans Safari. Ici, l'app est affichée dans Claude, qui bloque ce type de fichier.</p>

    <div class="actions"><div class="right"><button class="btn primary" id="cancel">Compris</button></div></div></div></div></div>`;
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  document.getElementById("cancel").onclick = closeSheet;
}
function upcomingEntries() {

}
let autoCal = true;
try { autoCal = localStorage.getItem(KEY + "-autocal") !== "0"; } catch (e) {}

let db;
function load() {

}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { toast("Enregistrement impossible sur cet appareil. Faites une sauvegarde."); return false; }
}
load();

let tab = "accueil";
try { tab = localStorage.getItem(KEY+"-tab") || "accueil"; } catch (e) {}
let calMonth = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();

const view = document.getElementById("view");
const svc = id => db.services.find(s => s.id === id);

function dateBlock(s, color) {
  const d = parse(s);
  return `<div class="date" style="--svc:${color||"var(--line)"}"><b>${d.getDate()}</b><span>${MOIS_C[d.getMonth()]}</span></div>`;
}
function exTag(o) { return o.example ? `<span class="example">exemple</span>` : ""; }

function vacItem(v) {
  const s = svc(v.serviceId);
  const past = v.date < todayIso();
  return `<button class="item" data-edit="vacation" data-id="${v.id}">
    ${dateBlock(v.date, s?.color)}
    <div class="main"><div class="t">${esc(s?.nom || "Service non renseigné")}${exTag(v)}</div>
    <div class="s"><span class="mono">${v.debut}–${v.fin}</span> · ${JOURS[parse(v.date).getDay()]}${v.note ? " · " + esc(v.note) : ""}</div></div>
    <div style="text-align:right"><div class="mono" style="font-weight:600">${fmtH(duration(v.debut, v.fin, v.pause))}</div><span class="pill ${past ? "ok" : ""}">${past ? "Effectuée" : "Prévue"}</span></div>
  </button>`;
}
function tirItem(t) {
  const st = t.statut === "fait" ? ["ok","Fait"] : t.date < todayIso() ? ["crit","À valider"] : ["warn","Prévu"];
  const dd = daysUntil(t.date);
  return `<button class="item" data-edit="tir" data-id="${t.id}">
    ${dateBlock(t.date, "var(--accent)")}
    <div class="main"><div class="t">${esc(t.type)}${exTag(t)}</div><div class="s">${esc(t.lieu)}${t.statut !== "fait" && dd >= 0 ? ` · dans ${dd} j` : ""}</div></div>
    <span class="pill ${st[0]}">${st[1]}</span></button>`;
}
function formItem(f) {
  const st = f.statut === "fait" ? ["ok","Suivie"] : f.statut === "annule" ? ["crit","Annulée"] : ["warn","Programmée"];
  const range = f.fin && f.fin !== f.debut ? `jusqu'au ${parse(f.fin).getDate()} ${MOIS_C[parse(f.fin).getMonth()]}` : "1 jour";
  return `<button class="item" data-edit="formation" data-id="${f.id}">
    ${dateBlock(f.debut, "var(--muted)")}
    <div class="main"><div class="t">${esc(f.intitule)}${exTag(f)}</div><div class="s">${esc(f.lieu)} · ${range}</div></div>
    <span class="pill ${st[0]}">${st[1]}</span></button>`;
}
const listOr = (items, fn, empty) => `<div class="list">${items.length ? items.map(fn).join("") : `<div class="empty">${empty}</div>`}</div>`;

function exampleBanner() {
  if (!db.example) return "";
  return `<div class="banner"><span>Données d'exemple affichées. Effacez-les pour commencer avec votre propre carnet.</span>
    <button class="btn" id="clearEx">Effacer les exemples</button></div>`;
}

function renderAccueil() {
  const t = todayIso(), y = new Date().getFullYear(), m = new Date().getMonth();
  const inMonth = db.vacations.filter(v => { const d = parse(v.date); return d.getFullYear() === y && d.getMonth() === m; });
  const inYear = db.vacations.filter(v => parse(v.date).getFullYear() === y && v.date <= t);
  const minYear = inYear.reduce((a, v) => a + duration(v.debut, v.fin, v.pause), 0);
  const upcoming = [
    ...db.vacations.filter(v => v.date >= t).map(v => ({ d: v.date, html: vacItem(v) })),
    ...db.tirs.filter(x => x.date >= t && x.statut !== "fait").map(x => ({ d: x.date, html: tirItem(x) })),
    ...db.formations.filter(f => (f.fin || f.debut) >= t && f.statut !== "annule").map(f => ({ d: f.debut, html: formItem(f) })),
  ].sort((a, b) => a.d.localeCompare(b.d)).slice(0, 6);
  const tirsFaits = db.tirs.filter(x => x.statut === "fait" && parse(x.date).getFullYear() === y).length;
  const obj = Number(db.settings.tirObjectif) || 0;
  return `${exampleBanner()}
  <div class="stats">
    <div class="stat"><b>${inMonth.length}</b><span>Vacations en ${MOIS[m]}</span></div>
    <div class="stat"><b>${inYear.length}</b><span>Jours effectués ${y}</span></div>
    <div class="stat"><b>${fmtH(minYear)}</b><span>Heures effectives ${y}</span></div>
  </div>
  ${calendar()}
  <div class="section-head"><h2>À venir</h2><button class="btn" id="calAll">Tout ajouter à l'agenda</button></div>
  ${upcoming.length ? `<div class="list">${upcoming.map(u => u.html).join("")}</div>` : `<div class="list"><div class="empty">Rien de programmé. Touchez + pour ajouter une vacation.</div></div>`}
  ${obj ? `<div class="card"><div class="section-head"><h2>Tir ${y}</h2><span class="mono">${tirsFaits} / ${obj}</span></div>
    <div class="progress"><i style="width:${Math.min(100, tirsFaits/obj*100)}%"></i></div>
    <span class="hint">Séances effectuées cette année sur l'objectif que vous avez fixé.</span></div>` : ""}`;
}

function calendar() {
  const { y, m } = calMonth;
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const t = todayIso();
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const s = iso(d);
    const vs = db.vacations.filter(v => v.date === s);
    const tirs = db.tirs.some(x => x.date === s);
    const forms = db.formations.some(f => f.debut <= s && (f.fin || f.debut) >= s && f.statut !== "annule");
    const dots = [...vs.map(v => svc(v.serviceId)?.color || "var(--muted)"), ...(tirs ? ["var(--crit)"] : []), ...(forms ? ["var(--warn)"] : [])].slice(0, 3);
    const label = `${d.getDate()} ${MOIS[d.getMonth()]}${vs.length ? ", " + vs.length + " vacation" : ""}${tirs ? ", tir" : ""}${forms ? ", formation" : ""}`;
    cells += `<button class="day ${d.getMonth() !== m ? "out" : ""} ${s === t ? "today" : ""} ${dots.length ? "has" : ""}" data-day="${s}" aria-label="${label}">
      ${d.getDate()}<span class="dots">${dots.map(c => `<i style="--c:${c}"></i>`).join("")}</span></button>`;
  }
  const legend = db.services.map(s => `<span><i style="--c:${s.color}"></i>${esc(s.nom)}</span>`).join("") +
    `<span><i style="--c:var(--crit)"></i>Tir</span><span><i style="--c:var(--warn)"></i>Formation</span>`;
  return `<div class="cal"><div class="cal-head">
      <button class="btn ghost" data-cal="-1" aria-label="Mois précédent">‹</button>
      <b>${MOIS[m]} ${y}</b>
      <button class="btn ghost" data-cal="1" aria-label="Mois suivant">›</button></div>
    <div class="cal-grid">${["L","M","M","J","V","S","D"].map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="legend">${legend}</div></div>`;
}

function renderVacations() {
  const sorted = [...db.vacations].sort((a, b) => b.date.localeCompare(a.date));
  const groups = {};
  sorted.forEach(v => { const k = v.date.slice(0, 7); (groups[k] ||= []).push(v); });
  const keys = Object.keys(groups);
  if (!keys.length) return `${exampleBanner()}<div class="list"><div class="empty">Aucune vacation. Touchez + pour saisir votre première vacation.</div></div>`;
  return exampleBanner() + keys.map(k => {
    const [y, m] = k.split("-").map(Number);
    const tot = groups[k].reduce((a, v) => a + duration(v.debut, v.fin, v.pause), 0);
    return `<div class="section-head"><h2>${MOIS[m-1]} ${y}</h2><span class="mono">${groups[k].length} j · ${fmtH(tot)}</span></div>
      <div class="list">${groups[k].map(vacItem).join("")}</div>`;
  }).join("");
}

function renderTir() {
  const y = new Date().getFullYear();
  const t = todayIso();
  const prevus = db.tirs.filter(x => x.statut !== "fait").sort((a, b) => a.date.localeCompare(b.date));
  const faits = db.tirs.filter(x => x.statut === "fait").sort((a, b) => b.date.localeCompare(a.date));
  const nb = faits.filter(x => parse(x.date).getFullYear() === y).length;
  const obj = Number(db.settings.tirObjectif) || 0;
  const last = faits[0];
  return `${exampleBanner()}
  <div class="card">
    <div class="section-head"><h2>Objectif ${y}</h2><span class="mono">${nb} / ${obj || "–"}</span></div>
    ${obj ? `<div class="progress"><i style="width:${Math.min(100, nb/obj*100)}%"></i></div>` : ""}
    <div class="hint">${last ? `Dernière séance : ${parse(last.date).getDate()} ${MOIS[parse(last.date).getMonth()]} ${parse(last.date).getFullYear()} (il y a ${-daysUntil(last.date)} jours).` : "Aucune séance enregistrée."}</div>
    <div class="row2" style="align-items:end"><div class="field"><label for="tirObj">Séances visées par an</label>
      <input id="tirObj" type="number" min="0" max="12" inputmode="numeric" value="${obj}"></div>
      <span class="hint">À ajuster selon les consignes de votre unité.</span></div>
  </div>
  <div class="section-head"><h2>Programmés</h2></div>
  ${listOr(prevus, tirItem, "Aucun recyclage programmé.")}
  <div class="section-head"><h2>Effectués</h2></div>
  ${listOr(faits, tirItem, "Aucune séance effectuée enregistrée.")}`;
}

function renderFormations() {
  const t = todayIso();
  const a = db.formations.filter(f => (f.fin || f.debut) >= t && f.statut === "prevu").sort((x, y) => x.debut.localeCompare(y.debut));
  const b = db.formations.filter(f => !a.includes(f)).sort((x, y) => y.debut.localeCompare(x.debut));
  return `${exampleBanner()}
  <div class="section-head"><h2>Programmées</h2></div>${listOr(a, formItem, "Aucune formation programmée.")}
  <div class="section-head"><h2>Historique</h2></div>${listOr(b, formItem, "Aucune formation passée.")}`;
}

function renderServices() {
  const items = db.services.map(s => {
    const vs = db.vacations.filter(v => v.serviceId === s.id);
    const tot = vs.filter(v => v.date <= todayIso()).reduce((a, v) => a + duration(v.debut, v.fin, v.pause), 0);
    return `<button class="item" data-edit="service" data-id="${s.id}" style="grid-template-columns: 14px 1fr auto">
      <span style="width:14px;height:14px;border-radius:50%;background:${s.color}"></span>
      <div class="main"><div class="t">${esc(s.nom)}${exTag(s)}</div><div class="s">${esc(s.unite || "")}</div></div>
      <div style="text-align:right"><div class="mono">${vs.length} vac.</div><div class="hint mono">${fmtH(tot)}</div></div></button>`;
  });
  return `${exampleBanner()}
  <div class="section-head"><h2>Affectations</h2><span class="hint">touchez + pour en ajouter</span></div>
  <div class="list">${items.length ? items.join("") : `<div class="empty">Ajoutez les services où vous êtes affecté (ex. police secours, accueil…).</div>`}</div>
  <div class="card">
    <h2>Agenda iPhone</h2>
    <span class="hint">Chaque vacation, séance de tir ou formation peut être ajoutée à l'app Calendrier (et donc à iCloud), avec un rappel. Si vous renvoyez un événement modifié, choisissez le même calendrier pour qu'il soit mis à jour.</span>
    <div class="actions"><button class="btn primary" id="calAll2">Ajouter tout le planning à venir</button></div>
  </div>
  <div class="card">
    <h2>Sauvegarde</h2>
    <span class="hint">Vos données restent sur cet appareil, dans ce navigateur. Copiez régulièrement la sauvegarde (Notes, mail à vous-même) pour ne rien perdre si les données de Safari sont effacées.</span>
    <div class="actions"><button class="btn primary" id="exportBtn">Copier la sauvegarde</button><button class="btn" id="importBtn">Restaurer</button></div>
    <textarea class="backup" id="backupBox" hidden aria-label="Sauvegarde"></textarea>
    <div class="actions" id="importActions" hidden><button class="btn primary" id="importGo">Restaurer ces données</button></div>
  </div>`;
}

function render() {
  try { localStorage.setItem(KEY+"-tab", tab); } catch (e) {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  view.innerHTML = ({ accueil: renderAccueil, vacations: renderVacations, tir: renderTir, formations: renderFormations, services: renderServices })[tab]();
  const add = document.getElementById("addBtn");
  add.setAttribute("aria-label", { accueil: "Ajouter une vacation", vacations: "Ajouter une vacation", tir: "Programmer un tir", formations: "Ajouter une formation", services: "Ajouter un service" }[tab]);
}

/* ---------- Forms ---------- */
const sheetRoot = document.getElementById("sheetRoot");
function closeSheet() { sheetRoot.innerHTML = ""; }
function openSheet(title, body, onSubmit, onDelete, kind, existing) {
  sheetRoot.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="grip"></div><form id="f" novalidate><h2>${esc(title)}</h2>${body}
    ${kind ? `<label class="check"><input type="checkbox" id="autoCal" ${autoCal ? "checked" : ""}> Ajouter à mon agenda iPhone en enregistrant</label>` : ""}
    <div class="actions">${onDelete ? `<button type="button" class="btn danger" id="del">Supprimer</button>` : ""}${existing ? `<button type="button" class="btn" id="calOne">Agenda</button>` : ""}
      <div class="right"><button type="button" class="btn" id="cancel">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></div>
    <div class="confirm" id="confirmDel" hidden>Supprimer définitivement ?<button type="button" class="btn danger" id="delYes">Oui, supprimer</button><button type="button" class="btn" id="delNo">Non</button></div>
    </form></div></div>`;
  const f = document.getElementById("f");
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  document.getElementById("cancel").onclick = closeSheet;
  if (onDelete) {
    document.getElementById("del").onclick = () => { document.getElementById("confirmDel").hidden = false; };
    document.getElementById("delNo").onclick = () => { document.getElementById("confirmDel").hidden = true; };
    document.getElementById("delYes").onclick = () => { onDelete(); commit("Supprimé"); };
  }
  if (existing) document.getElementById("calOne").onclick = () => sendToCalendar([[kind, existing]]);
  f.addEventListener("submit", e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(f));
    const res = onSubmit(data);
    if (typeof res === "string") { toast(res); return; }
    const box = document.getElementById("autoCal");
    if (box) { autoCal = box.checked; try { localStorage.setItem(KEY + "-autocal", autoCal ? "1" : "0"); } catch (err) {} }
    commit("Enregistré");
    if (box && box.checked && res) sendToCalendar([[kind, res]]);
  });
  return f;
}
function commit(msg) { db.example = db.example && [...db.vacations, ...db.tirs, ...db.formations, ...db.services].some(o => o.example); save(); closeSheet(); render(); toast(msg); }
function upsert(list, obj) { const i = list.findIndex(o => o.id === obj.id); if (i >= 0) list[i] = obj; else list.push(obj); return obj; }
const opt = (v, cur, label) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label ?? v)}</option>`;

function vacationForm(v, presetDate) {
  const isNew = !v;
  v ||= { id: uid(), date: presetDate || todayIso(), debut: "07:00", fin: "15:00", pause: 30, serviceId: db.services[0]?.id || "", note: "" };
  const body = `
    <div class="field"><label for="vDate">Date</label><input id="vDate" name="date" type="date" value="${v.date}" required></div>
    <div class="row3">
      <div class="field"><label for="vDeb">Début</label><input id="vDeb" name="debut" type="time" value="${v.debut}"></div>
      <div class="field"><label for="vFin">Fin</label><input id="vFin" name="fin" type="time" value="${v.fin}"></div>
      <div class="field"><label for="vPause">Pause (min)</label><input id="vPause" name="pause" type="number" min="0" step="5" inputmode="numeric" value="${v.pause}"></div>
    </div>
    <div class="calc"><span class="hint">Durée effective</span><b id="vDur">${fmtH(duration(v.debut, v.fin, v.pause))}</b></div>
    <div class="field"><label for="vSvc">Service d'affectation</label><select id="vSvc" name="serviceId">
      ${db.services.map(s => opt(s.id, v.serviceId, s.nom + (s.unite ? " · " + s.unite : ""))).join("")}${opt("", v.serviceId, "— Non renseigné —")}</select></div>
    <div class="field"><label for="vNote">Note</label><textarea id="vNote" name="note" placeholder="Équipage, mission, indicatif…">${esc(v.note)}</textarea></div>`;
  const f = openSheet(isNew ? "Nouvelle vacation" : "Modifier la vacation", body, d => {
    if (!d.date) return "Indiquez la date de la vacation.";
    return upsert(db.vacations, { ...v, ...d, pause: Number(d.pause) || 0, example: false });
  }, isNew ? null : () => { db.vacations = db.vacations.filter(x => x.id !== v.id); }, "vacation", isNew ? null : v);
  const upd = () => { document.getElementById("vDur").textContent = fmtH(duration(f.debut.value, f.fin.value, f.pause.value)); };
  ["debut","fin","pause"].forEach(n => f[n].addEventListener("input", upd));
}

function tirForm(t) {
  const isNew = !t;
  t ||= { id: uid(), date: todayIso(), lieu: "", type: "Séance de tir réglementaire", statut: "prevu", note: "" };
  const types = ["Séance de tir réglementaire", "Recyclage arme de poing", "Recyclage arme longue", "Tir de qualification", "Autre"];
  const body = `
    <div class="row2"><div class="field"><label for="tDate">Date</label><input id="tDate" name="date" type="date" value="${t.date}"></div>
    <div class="field"><label for="tSt">Statut</label><select id="tSt" name="statut">${opt("prevu", t.statut, "Prévu")}${opt("fait", t.statut, "Effectué")}</select></div></div>
    <div class="field"><label for="tType">Type</label><select id="tType" name="type">${types.map(x => opt(x, t.type)).join("")}${types.includes(t.type) ? "" : opt(t.type, t.type)}</select></div>
    <div class="field"><label for="tLieu">Lieu / stand</label><input id="tLieu" name="lieu" value="${esc(t.lieu)}" placeholder="Stand de tir…"></div>
    <div class="field"><label for="tNote">Note</label><textarea id="tNote" name="note" placeholder="Résultat, moniteur, convocation…">${esc(t.note)}</textarea></div>`;
  openSheet(isNew ? "Programmer un tir" : "Séance de tir", body, d => {
    if (!d.date) return "Indiquez la date de la séance.";
    return upsert(db.tirs, { ...t, ...d, example: false });
  }, isNew ? null : () => { db.tirs = db.tirs.filter(x => x.id !== t.id); }, "tir", isNew ? null : t);
}

function formationForm(fo) {
  const isNew = !fo;
  fo ||= { id: uid(), debut: todayIso(), fin: todayIso(), intitule: "", lieu: "", statut: "prevu", note: "" };
  const body = `
    <div class="field"><label for="fInt">Intitulé</label><input id="fInt" name="intitule" value="${esc(fo.intitule)}" placeholder="Ex. GTPI, secourisme, procédure…"></div>
    <div class="row2"><div class="field"><label for="fDeb">Du</label><input id="fDeb" name="debut" type="date" value="${fo.debut}"></div>
    <div class="field"><label for="fFin">Au</label><input id="fFin" name="fin" type="date" value="${fo.fin || fo.debut}"></div></div>
    <div class="row2"><div class="field"><label for="fLieu">Lieu</label><input id="fLieu" name="lieu" value="${esc(fo.lieu)}"></div>
    <div class="field"><label for="fSt">Statut</label><select id="fSt" name="statut">${opt("prevu", fo.statut, "Programmée")}${opt("fait", fo.statut, "Suivie")}${opt("annule", fo.statut, "Annulée")}</select></div></div>
    <div class="field"><label for="fNote">Note</label><textarea id="fNote" name="note">${esc(fo.note)}</textarea></div>`;
  openSheet(isNew ? "Nouvelle formation" : "Formation", body, d => {
    if (!d.intitule.trim()) return "Indiquez l'intitulé de la formation.";
    if (!d.debut) return "Indiquez la date de début.";
    if (d.fin && d.fin < d.debut) return "La date de fin précède la date de début.";
    return upsert(db.formations, { ...fo, ...d, fin: d.fin || d.debut, example: false });
  }, isNew ? null : () => { db.formations = db.formations.filter(x => x.id !== fo.id); }, "formation", isNew ? null : fo);
}

function serviceForm(s) {
  const isNew = !s;
  s ||= { id: uid(), nom: "", unite: "", color: COLORS[db.services.length % COLORS.length] };
  const used = db.vacations.filter(v => v.serviceId === s.id).length;
  const body = `
    <div class="field"><label for="sNom">Service</label><input id="sNom" name="nom" value="${esc(s.nom)}" placeholder="Ex. Police secours, BAC, accueil…"></div>
    <div class="field"><label for="sUn">Unité / commissariat</label><input id="sUn" name="unite" value="${esc(s.unite)}"></div>
    <div class="field"><label>Couleur dans le calendrier</label><div class="swatches">
      ${COLORS.map((c, i) => `<label><input type="radio" name="color" value="${c}" ${c === s.color ? "checked" : ""} aria-label="Couleur ${i+1}"><span style="--c:${c}"></span></label>`).join("")}</div></div>
    ${used && !isNew ? `<span class="hint">${used} vacation(s) liée(s). En cas de suppression, elles resteront sans service.</span>` : ""}`;
  openSheet(isNew ? "Nouveau service" : "Service", body, d => {
    if (!d.nom.trim()) return "Indiquez le nom du service.";
    upsert(db.services, { ...s, ...d, example: false });
  }, isNew ? null : () => { db.services = db.services.filter(x => x.id !== s.id); db.vacations.forEach(v => { if (v.serviceId === s.id) v.serviceId = ""; }); });
}

function dayChoice(s) {
  const d = parse(s);
  const vs = db.vacations.filter(v => v.date === s);
  const ts = db.tirs.filter(x => x.date === s);
  const fs = db.formations.filter(f => f.debut <= s && (f.fin || f.debut) >= s);
  if (!vs.length && !ts.length && !fs.length) { vacationForm(null, s); return; }
  sheetRoot.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Journée">
    <div class="grip"></div><div style="display:flex;flex-direction:column;gap:12px">
    <h2>${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}</h2>
    <div class="list">${[...vs.map(vacItem), ...ts.map(tirItem), ...fs.map(formItem)].join("")}</div>
    <div class="actions"><button class="btn" id="cancel">Fermer</button><button class="btn primary" id="addHere">Ajouter une vacation ce jour</button></div></div></div></div>`;
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
  document.getElementById("cancel").onclick = closeSheet;
  document.getElementById("addHere").onclick = () => vacationForm(null, s);
  sheetRoot.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => edit(b.dataset.edit, b.dataset.id)));
}

function edit(kind, id) {
  if (kind === "vacation") vacationForm(db.vacations.find(x => x.id === id));
  if (kind === "tir") tirForm(db.tirs.find(x => x.id === id));
  if (kind === "formation") formationForm(db.formations.find(x => x.id === id));
  if (kind === "service") serviceForm(db.services.find(x => x.id === id));
}

let toastTimer;
function toast(msg) {
  const r = document.getElementById("toastRoot");
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => r.innerHTML = "", 2600);
}

/* ---------- Events ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));
document.getElementById("addBtn").addEventListener("click", () => {
  ({ accueil: () => vacationForm(), vacations: () => vacationForm(), tir: () => tirForm(), formations: () => formationForm(), services: () => serviceForm() })[tab]();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

view.addEventListener("click", e => {
  const ed = e.target.closest("[data-edit]"); if (ed) { edit(ed.dataset.edit, ed.dataset.id); return; }
  const day = e.target.closest("[data-day]"); if (day) { dayChoice(day.dataset.day); return; }
  const cal = e.target.closest("[data-cal]");
  if (cal) { let m = calMonth.m + Number(cal.dataset.cal), y = calMonth.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } calMonth = { y, m }; render(); return; }
  if (e.target.id === "calAll" || e.target.id === "calAll2") { sendToCalendar(upcomingEntries()); return; }
  if (e.target.id === "clearEx") {
    db.vacations = db.vacations.filter(o => !o.example); db.tirs = db.tirs.filter(o => !o.example);
    db.formations = db.formations.filter(o => !o.example); db.services = db.services.filter(o => !o.example);
    db.example = false; save(); render(); toast("Exemples effacés. Commencez par ajouter vos services.");
  }
  if (e.target.id === "exportBtn") {
    const txt = JSON.stringify(db);
    const box = document.getElementById("backupBox"); box.hidden = false; box.value = txt; document.getElementById("importActions").hidden = true;
    const done = () => toast("Sauvegarde copiée. Collez-la dans Notes ou un mail.");
    const fallback = () => { box.focus(); box.select(); toast("Sélectionnez le texte puis copiez-le."); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (err) { fallback(); }
  }
  if (e.target.id === "importBtn") {
    const box = document.getElementById("backupBox"); box.hidden = false; box.value = ""; box.placeholder = "Collez ici le texte de sauvegarde"; box.focus();
    document.getElementById("importActions").hidden = false;
  }
  if (e.target.id === "importGo") {
    try {
      const d = JSON.parse(document.getElementById("backupBox").value);
      if (!Array.isArray(d.vacations) || !Array.isArray(d.services)) throw 0;
      d.tirs ||= []; d.formations ||= []; d.settings ||= { tirObjectif: 3 };
      db = d; save(); render(); toast("Données restaurées.");
    } catch (err) { toast("Ce texte n'est pas une sauvegarde valide du carnet."); }
  }
});
view.addEventListener("change", e => {
  if (e.target.id === "tirObj") { db.settings.tirObjectif = Math.max(0, Number(e.target.value) || 0); save(); render(); }
});

render();
})();
</script>

</body>
</html>
